[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caracara-archicad-mcp"
version = "2026.11.0"
description = "A personal fork of tapir-archicad-mcp for custom workflows and experimental Archicad tool bindings."
readme = "README.md"
authors = [
    { name = "SzamosiMate", email = "szamimate@yahoo.com" }
]
maintainers = [
    { name = "parikshit99" }
]
requires-python = ">=3.12, <3.15"
license = "MIT"

keywords = ["archicad", "bim", "automation", "api", "mcp", "ai", "llm", "caracara"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=2,<3",
    "multiconn-archicad==0.9.6",
    "uvicorn>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/parikshit99/Caracara-Archicad-MCP"
"Bug Tracker" = "https://github.com/parikshit99/Caracara-Archicad-MCP/issues"
"Upstream Repository" = "https://github.com/SzamosiMate/tapir-archicad-MCP"

[project.scripts]
archicad-server = "caracara_archicad_mcp.server:main"
caracara-server = "caracara_archicad_mcp.server:main"
tapir-archicad-mcp = "caracara_archicad_mcp.server:main"
caracara-archicad = "caracara_archicad_mcp.server:main"

[tool.hatch.build.targets.sdist]
# The website and logo masters are not part of the Python package.
exclude = ["/site", "/branding"]

[tool.hatch.build.targets.wheel]
packages = ["src/caracara_archicad_mcp", "src/tapir_archicad_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned so a ruff upgrade cannot silently change what CI enforces.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "BLE",      # blind except
    "LOG",      # logging misuse
    "RUF",      # ruff-specific
    "C901",     # function complexity (REVIEW.md R7)
    "ERA",      # commented-out code (REVIEW.md R8)
    "T20",      # print in place of logging (REVIEW.md R8)
]
# Generated modules are pure generator output; regenerate rather than hand-fix them.
exclude = ["src/caracara_archicad_mcp/tools/generated/**"]

[tool.ruff.lint.per-file-ignores]
# These modules configure and log through the root logger on purpose.
"src/caracara_archicad_mcp/server.py" = ["LOG015"]
"src/caracara_archicad_mcp/logging_config.py" = ["LOG015"]
# Imported for their registration side effects.
"src/caracara_archicad_mcp/tools/__init__.py" = ["F401"]
# Long lines here are templates of generated code.
"scripts/generate_tools.py" = ["E501"]
# Command-line scripts report to the terminal.
"scripts/**" = ["T20"]
# Fixture-style defaults and nested context managers read better in tests.
"tests/**" = ["B008", "SIM117"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = true

[tool.coverage.run]
source = ["caracara_archicad_mcp"]
# Generated wrappers are exercised by test_generated_tools; measuring them dilutes the signal.
omit = ["*/tools/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
