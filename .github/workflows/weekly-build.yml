name: Weekly build

on:
  schedule:
    # Fridays 03:30 UTC (09:00 IST).
    - cron: "30 3 * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if master has not changed since the last weekly build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Check for changes since the last weekly build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      last: ${{ steps.compare.outputs.last }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare master with the last successful weekly build
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        # A run that skipped still records master's commit, which is the last built
        # commit; a failed build is not "success", so the next Friday retries it.
        run: |
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly-build.yml --branch master \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [[ "$FORCE" == "true" ]]; then
            CHANGED=true; REASON="Forced by workflow_dispatch."
          elif [[ -z "$LAST" ]]; then
            CHANGED=true; REASON="No earlier successful weekly build."
          elif [[ "$LAST" == "$GITHUB_SHA" ]]; then
            CHANGED=false; REASON="master is still at ${LAST:0:7}, already built."
          elif git merge-base --is-ancestor "$LAST" "$GITHUB_SHA" 2>/dev/null; then
            CHANGED=true; REASON="$(git rev-list --count "$LAST..$GITHUB_SHA") new commit(s) since ${LAST:0:7}."
          else
            CHANGED=true; REASON="Last built commit ${LAST:0:7} is no longer in master's history."
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          {
            echo "### Weekly build"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Build: $([[ $CHANGED == true ]] && echo yes || echo 'skipped')"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHANGED" == "true" && -n "$LAST" ]] && git cat-file -e "$LAST" 2>/dev/null; then
            { echo; echo "#### Changes"; git log --format='- %h %s' "$LAST..$GITHUB_SHA" | head -50; } >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI gates
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml

  build:
    name: Build and publish the weekly pre-release
    needs: [changes, ci]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: weekly
      LAST: ${{ needs.changes.outputs.last }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Compute build label
        id: label
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          DATE=$(date -u +%Y%m%d)
          echo "value=${VERSION}-weekly.${DATE}.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}+weekly.${DATE}.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      # The package and the bundle report this version, so a user can tell a weekly build from the
      # stable release it starts from. '+' starts a local version (PEP 440) and build metadata (SemVer),
      # valid in both pyproject.toml and manifest.json; PyPI refuses it, and this build is never uploaded.
      # The 'g' keeps a commit made only of digits from losing its leading zeros to PEP 440 normalisation.
      - name: Give the build its own version
        run: uv run --locked python scripts/release.py bump "${{ steps.label.outputs.version }}"
      - uses: ./.github/actions/build-package
        with:
          label: ${{ steps.label.outputs.value }}
      - name: Add a fixed-name bundle for a permanent download link
        run: cp "dist/caracara-archicad-${{ steps.label.outputs.value }}.mcpb" dist/caracara-archicad-weekly.mcpb
      - name: Write release notes
        run: |
          {
            echo "Automated weekly build of \`master\` at ${GITHUB_SHA:0:7}, built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "This is a pre-release for testing. It is replaced every Friday when \`master\` has changed;"
            echo "versioned releases are published separately."
            echo
            echo "Latest bundle (permanent link): https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/caracara-archicad-weekly.mcpb"
            echo
            echo "Build label: \`${{ steps.label.outputs.value }}\` · [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            if [[ -n "$LAST" ]] && git cat-file -e "$LAST" 2>/dev/null && git merge-base --is-ancestor "$LAST" "$GITHUB_SHA"; then
              echo
              echo "### Changes since the previous weekly build (${LAST:0:7})"
              git log --format='- %h %s' "$LAST..$GITHUB_SHA" | head -100
            fi
          } > "$RUNNER_TEMP/notes.md"
      - name: Replace the rolling weekly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        # Recreating the release moves the tag to this commit. Releases made with
        # GITHUB_TOKEN do not trigger other workflows, and release.yml skips this tag.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Weekly build ${{ steps.label.outputs.value }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Summarize
        run: |
          {
            echo "### Published pre-release \`$TAG\` (${{ steps.label.outputs.value }})"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
